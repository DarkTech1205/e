name: Build Geode Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            os: windows-latest
          - platform: android64
            os: ubuntu-latest
          - platform: android32
            os: ubuntu-latest
          - platform: mac
            os: macos-latest
          - platform: ios
            os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          platform: ${{ matrix.platform }}
          sdk: v6.0.0-beta.2

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: secret-mod-buttons-${{ matrix.platform }}
          path: build/*.geode
          if-no-files-found: warn
